# Recursos compartidos (salida de testparm -s, según Anexo B.1 del informe).
# Reemplazar por la salida real con scripts/exportar_configuracion.sh

[contabilidad]
	path = /srv/samba/contabilidad
	valid users = @contabilidad @gerencia
	write list = @contabilidad
	read only = yes
	guest ok = no
	create mask = 0660
	directory mask = 02770
	vfs objects = full_audit
	full_audit:syslog = yes
	full_audit:priority = NOTICE
	full_audit:facility = LOCAL7
	full_audit:success = connect openat create_file pwrite renameat unlinkat
	full_audit:failure = connect openat create_file pwrite renameat unlinkat
	full_audit:prefix = %u|%I|%S

